name: kisansetu

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kisan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisan}
      POSTGRES_DB: kisansetu
    ports:
      - "127.0.0.1:${DB_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisan -d kisansetu"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-kisan-redis}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6384}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kisan-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    # antivirus for every upload (clamd INSTREAM on 3310). First start downloads ~250 MB of signatures (freshclam keeps
    # them updated); clamd needs ~1.5 GB RAM. The image ships its own healthcheck.
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3320}:3310"
    volumes:
      - clamavdb:/var/lib/clamav

  app:
    build: .
    profiles: ["full"]
    restart: unless-stopped
    env_file: .env
    environment:
      # inside the container the app always listens on 8088 (image EXPOSE + healthcheck), whatever PORT the local
      # development server uses in .env; choose the published port with APP_PORT instead
      PORT: "8088"
      DATABASE_URL: postgresql+asyncpg://kisan:${POSTGRES_PASSWORD:-kisan}@db:5432/kisansetu
      REDIS_URL: redis://:${REDIS_PASSWORD:-kisan-redis}@redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    ports:
      - "${APP_PORT:-8088}:8088"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - appvar:/app/var

volumes:
  pgdata:
  redisdata:
  clamavdb:
  appvar:
